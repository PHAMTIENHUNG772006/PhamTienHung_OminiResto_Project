version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 - Relational Database for Multi-tenant ERP System
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_erp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - restaurant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - restaurant_network

  # ----------------------------------------------------------------------------
  # Redis 7 - Distributed Cache & Locks (Redisson)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: restaurant_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - restaurant_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - restaurant_network

  # ----------------------------------------------------------------------------
  # Adminer - Lightweight Web GUI for Database Management
  # Accessible at: http://localhost:8082
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: restaurant_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurant_network

volumes:
  restaurant_pgdata:
    name: restaurant_pgdata
  restaurant_redisdata:
    name: restaurant_redisdata

networks:
  restaurant_network:
    name: restaurant_network
    driver: bridge
